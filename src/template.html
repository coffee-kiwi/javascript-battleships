<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleships</title>
  </head>
  <body>
    <main>
      <section class="sidebar">
        <button type="button" id="new-game">New Game</button>
                <!-- Or change these buttons to be pictures of the game pieces? -->
        <button type="button" id="toggleDir">Horizontal Placement</button>
        <button type="button" id="carrier" draggable="true">Carrier</button>
        <button type="button" id="battleship" draggable="true">Battleship</button>
        <button type="button" id="cruiser" draggable="true">Cruiser</button>
        <button type="button" id="destroyer" draggable="true">Destroyer</button>
        <button type="button" id="patrol" draggable="true">Patrol</button>
        <button type="button" id="reset">Reset ship placement</button>
      </section>

      <section class="player-view">
        <div class="message-box">
          <h1 id="players-message"></h1>
        </div>

        <div class="players-board">

        </div>

      </section>

      <section class="opp-view">
        <div class="message-box">
          <h1 id="opps-message"></h1>
        </div>

        <div class="opp-board">
          
        </div>

      </section>

    </main>
  </body>
</html>
