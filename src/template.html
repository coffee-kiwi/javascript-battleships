<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleships</title>
  </head>
  <body>
    <main>
      <section class="sidebar">
        <button type="button" id="new-game">New Game</button>
                <!-- Or change these buttons to be pictures of the game pieces? -->
        <button type="button" id="toggleDir" >Horizontal Placement</button>
        <button type="button" id="carrier" class="draggableShips" draggable="true">Carrier</button>
        <button type="button" id="battleship" class="draggableShips" draggable="true">Battleship</button>
        <button type="button" id="cruiser" class="draggableShips" draggable="true">Cruiser</button>
        <button type="button" id="destroyer" class="draggableShips" draggable="true">Destroyer</button>
        <button type="button" id="patrol" class="draggableShips" draggable="true">Patrol</button>
        <button type="button" id="reset">Reset ship placement</button>
      </section>

      <div class="message-box">
        <h1 id="players-message"></h1>
      </div>

      <section class="opp-board invisible">
        <!-- <div class="message-box">
          <h1 id="opps-message"></h1>
        </div> -->

        <!-- <div class="">
          
        </div> -->

      </section>

      <div class="in-between">
        <button type="button" id="nextPlayerSetup" class="betweenBtn invisible">Next Player</button>
        <button type="button" id="startGame" class="betweenBtn invisible gone">Start Game</button>
        <button type="button" id="passing" class="betweenBtn invisible gone">Click before passing</button>
        <button type="button" id="nextTurn" class="betweenBtn invisible gone">Next Player</button>
      </div>

      <section class="player-view">
        <div class="players-board">

        </div>

      </section>



    </main>
  </body>
</html>
