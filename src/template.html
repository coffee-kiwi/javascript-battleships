<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleships</title>
  </head>
  <body>
    <main>
      <section class="sidebar">
        <button type="button" id="new-game">New Game</button>
                <!-- Or change these buttons to be pictures of the game pieces? -->
        <button type="button" id="toggleDir" >Horizontal Placement</button>
        <button type="button" id="reset">Reset ship placement</button>
        <div class="draggableShipsContainer">
          <div id="carrier" class="draggableShips" draggable="true">Carrier ⑤</div>
          <div id="battleship" class="draggableShips" draggable="true">Battleship ④</div>
          <div id="cruiser" class="draggableShips" draggable="true">Cruiser ③</div>
          <div id="destroyer" class="draggableShips" draggable="true">Destroyer ③</div>
          <div id="patrol" class="draggableShips" draggable="true">Patrol ②</div>
        </div>
        
        

      </section>

      <div class="message-box">
        <h1 id="players-message"></h1>
      </div>

      <section class="opp-board invisible">
      </section>

      <div class="in-between">
        <button type="button" id="nextPlayerSetup" class="betweenBtn gone">Next Player</button>
        <button type="button" id="startGame" class="betweenBtn gone">Start Game</button>
        <button type="button" id="passing" class="betweenBtn gone">Click before passing</button>
        <button type="button" id="nextTurn" class="betweenBtn gone">Next Player</button>
      </div>

      <div class="message-box">
        <h1 id="bottom-title" class="gone">Your ships are shown below:</h1>
      </div>
      <section class="player-view">
        <div class="players-board">

        </div>

      </section>



    </main>
  </body>
</html>
